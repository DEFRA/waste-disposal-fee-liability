services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  ################################################################################

  waste-disposal-fee-liability:
    build: ./
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
    networks:
      - cdp-tenant

################################################################################

networks:
  cdp-tenant:
    driver: bridge
