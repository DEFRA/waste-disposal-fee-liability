version: 2

updates:
  # Update NuGet packages
  - package-ecosystem: nuget
    directory: /
    open-pull-requests-limit: 10

    # Group all minor and patch updates into one shared PR. Major updates get their own PR.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

    ignore:
      # Major versions track the .NET target framework, so upgrade them alongside the TFM
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types:
          - 'version-update:semver-major'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    allow:
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    groups:
      github-actions:
        patterns:
          - '*'

  # Not the Dockerfile: it uses floating .NET 10.0 image tags, which change together with the target framework
